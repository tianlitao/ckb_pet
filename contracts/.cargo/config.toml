# CKB-VM runs scripts single-threaded and does not implement RISC-V atomic
# extension instructions. These flags (mirroring ckb-script-templates' Makefile)
# lower atomics to plain memory ops and enable the bit-manipulation
# subextensions that CKB-VM supports. Host builds (tests) are unaffected.
[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "target-feature=+zba,+zbb,+zbc,+zbs",
    "-C", "passes=lower-atomic",
]
